<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DE SIC Codes</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="./sicCodes.css" />
    <script type="module" src="./sicCodes.js"></script>
  </head>
  <body class="sic-page">
    <main class="sic-shell">
      <header class="modal sic-hero">
        <div>
          <h1>DE SIC Codes</h1>
          <p class="ownership-note">Crafted by Shrikanth K</p>
        </div>

        <div class="sic-hero-code" aria-live="polite">
          <span class="sic-result-label">Selected Issue Code</span>
          <output id="selectedCode" class="sic-result-code">Select a code</output>
          <p id="selectedLabel" class="sic-result-text">
            Start with Issue Code - 1.
          </p>
        </div>

        <div class="sic-header-actions">
          <button
            id="clearSicSelection"
            class="btn btn-secondary sic-clear-button"
            type="button"
          >
            Clear
          </button>
          <a
            class="btn btn-primary sic-home-link"
            href="../index.html"
            target="_blank"
            rel="noopener"
          >
            StatementZ
          </a>
          <label class="switch" title="Toggle light mode">
            <input
              id="themeToggle"
              type="checkbox"
              aria-label="Toggle light mode"
            />
            <span class="slider">
              <div class="star star_1"></div>
              <div class="star star_2"></div>
              <div class="star star_3"></div>
              <svg viewBox="0 0 16 16" class="cloud" aria-hidden="true">
                <path
                  transform="matrix(.77976 0 0 .78395-299.99-418.63)"
                  fill="#fff"
                  d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"
                ></path>
              </svg>
            </span>
          </label>
        </div>
      </header>

      <section
        id="sicBranchTree"
        class="sic-branch-tree"
        aria-label="DE SIC code branch tree"
      ></section>
    </main>
  </body>
</html>
